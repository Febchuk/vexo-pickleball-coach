<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vexo Coach HUD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --cue: #5BD68A; --panel: rgba(18,24,21,0.42); --dim: #B9C7C0; --soft: #D2DCD6; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0E1411; color: #fff; font-family: Outfit, system-ui, sans-serif; overflow: hidden; }
  .stage { position: relative; height: 100vh; aspect-ratio: 1376 / 1824; margin: 0 auto; overflow: hidden; }
  #bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .edge { position: absolute; inset: 0; pointer-events: none; opacity: 0; box-shadow: inset 0 0 0 4px var(--cue), inset 0 0 90px var(--cue); }

  .panel { position: absolute; background: var(--panel); border: 1px solid rgba(255,255,255,0.18); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); border-radius: 22px; }
  .dot { width: 10px; height: 10px; border-radius: 5px; flex-shrink: 0; }

  .brand { left: 2.5%; top: 2.5%; display: flex; align-items: center; gap: 12px; padding: 10px 14px; }
  .brand b { letter-spacing: 0.08em; }
  .brand span { color: var(--dim); font-size: 14px; }

  .cue { left: 4%; right: 4%; top: 17%; display: flex; align-items: center; justify-content: center; gap: 14px; padding: 12px 20px 12px 12px; border-radius: 26px; border: 2px solid var(--cue); }
  .cue .tag { padding: 6px 10px; border-radius: 8px; background: var(--cue); color: #1E2A3A; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; white-space: nowrap; }
  .cue .line { font-size: 24px; font-weight: 700; white-space: nowrap; letter-spacing: -0.01em; }
  .why { position: absolute; left: 50%; top: 26%; transform: translateX(-50%); color: var(--soft); font-size: 14px; padding: 4px 10px; border-radius: 6px; background: var(--panel); border: 1px solid rgba(255,255,255,0.18); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); white-space: nowrap; }

  .links { right: 2.5%; top: 2.5%; display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; font-size: 13px; color: var(--soft); }
  .links div { display: flex; align-items: center; gap: 8px; }
  .links .dot { width: 8px; height: 8px; }

  .swing { left: 2.5%; bottom: 3.9%; width: 56%; display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 26px; }
  .label { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: var(--dim); }
  .bar { position: relative; height: 8px; border-radius: 4px; background: #2A3A33; }
  .bar .ok { position: absolute; left: 33%; width: 34%; top: 0; bottom: 0; background: rgba(91,214,138,0.35); border-radius: 4px; }
  .bar .mark { position: absolute; top: -5px; width: 4px; height: 18px; margin-left: -2px; border-radius: 2px; background: #fff; }
  .scale { display: flex; justify-content: space-between; font-size: 12px; color: var(--dim); }
  .nums { display: flex; gap: 24px; }
  .nums div { display: flex; flex-direction: column; }
  .nums b { font-size: 24px; font-weight: 700; }
  .nums small { font-size: 12px; color: var(--dim); }

  .light { right: 2.5%; bottom: 3.9%; display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 26px; }
  .light .orb { width: 28px; height: 28px; border-radius: 14px; background: #3A4A43; }
  .light div { display: flex; flex-direction: column; }
  .light strong { font-size: 15px; font-weight: 600; }

  .target { position: absolute; border: 2px solid var(--cue); border-radius: 999px; box-shadow: 0 0 18px rgba(92,168,255,0.45); pointer-events: none; }
  .target .chip { position: absolute; left: 50%; bottom: calc(100% + 6px); transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 4px; white-space: nowrap; }
  .target .name { font-size: 12px; font-weight: 600; padding: 4px 9px; border-radius: 999px; background: var(--panel); border: 1px solid rgba(255,255,255,0.18); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); }
  .target .tgt { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; padding: 2px 7px; border-radius: 6px; background: var(--cue); color: #10203A; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main class="stage">
  <img id="bg" alt="">
  <div class="edge" id="edge"></div>
  <div class="target" id="target" hidden><div class="chip"><span class="tgt">TARGET</span><span class="name" id="tname"></span></div></div>

  <div class="panel brand">
    <span class="dot" style="background: #FF5D5D"></span>
    <b>VEXO</b>
    <span id="session">Waiting for the band</span>
  </div>

  <div class="panel cue" id="cue" hidden>
    <span class="tag" id="tag"></span>
    <span class="line" id="line"></span>
  </div>
  <div class="why" id="why" hidden></div>

  <div class="panel links">
    <div><span class="dot" style="background: #5BD68A"></span><span>Glasses · live</span></div>
    <div><span class="dot" style="background: #5BD68A"></span><span>Your band · 400/s</span></div>
    <div><span class="dot" style="background: #3A4A43"></span><span>Partner band · not paired</span></div>
  </div>

  <div class="panel swing">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span class="label">LAST SWING · BAND</span>
      <span id="verdict" style="font-size: 13px; font-weight: 600; color: var(--dim)">Swing to start</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div class="bar"><div class="ok"></div><div class="mark" id="mark" style="left: 50%; opacity: 0"></div></div>
      <div class="scale"><span>Early</span><span>On time</span><span>Late</span></div>
    </div>
    <div class="nums">
      <div><b id="speed">–</b><small>wrist speed</small></div>
      <div><b id="contact">–</b><small>contact point</small></div>
    </div>
  </div>

  <div class="panel light">
    <span class="orb" id="orb"></span>
    <div><span class="label">BAND LIGHT</span><strong id="lightText">Idle</strong></div>
  </div>
</main>

<script>
const LATE_MS = 15;
const BANNER_S = 3.2, FADE_S = 0.3, STALE_S = 2.4, SWING_LIGHT_S = 0.6, TACTIC_LIGHT_S = 1.6, EDGE_S = 0.5;
const KINDS = {
  late: { tag: 'FIX', color: '#F5B43C', light: 'Amber · fix cue', verdict: 'Late', why: (s) => `Contact ${Math.round(s.impact_vs_peak_ms)} ms after peak speed` },
  short: { tag: 'FIX', color: '#F5B43C', light: 'Amber · fix cue', verdict: 'Short', why: (s) => `Follow-through ${Math.round(s.follow_ms)} ms` },
  slow: { tag: 'FIX', color: '#F5B43C', light: 'Amber · fix cue', verdict: 'Slow', why: (s) => `Wrist speed ${Math.round(s.peak_gyro).toLocaleString()}°/s` },
  good: { tag: 'GOOD SHOT', color: '#5BD68A', light: 'Green · good shot', verdict: 'Clean', why: (s) => `Contact at peak speed · ${Math.round(s.peak_gyro).toLocaleString()}°/s` },
  attack: { tag: 'ATTACK', color: '#5CA8FF', light: 'Blue · attack cue' },
};
const $ = (id) => document.getElementById(id);
const ease = (x) => 1 - Math.pow(1 - Math.max(0, Math.min(1, x)), 3);
let track;

window.setup = (t) => { track = t; };

function barPos(ms) {
  return Math.max(2, Math.min(98, ms > LATE_MS ? 67 + ((ms - LATE_MS) / 100) * 31
    : ms < -40 ? 33 - ((-40 - ms) / 100) * 31
    : 33 + ((ms + 40) / (LATE_MS + 40)) * 34));
}

function lerpBox(keys, t) {
  if (t < keys[0].t || t > keys[keys.length - 1].t) return null;
  const i = Math.max(0, keys.findIndex((k) => k.t >= t) - 1);
  const a = keys[i], b = keys[Math.min(i + 1, keys.length - 1)];
  const u = b.t === a.t ? 0 : (t - a.t) / (b.t - a.t);
  return Object.fromEntries(['x', 'y', 'w', 'h'].map((k) => [k, a[k] + (b[k] - a[k]) * u]));
}

window.renderFrame = async (t, url) => {
  const img = $('bg');
  img.src = url;
  await img.decode();
  const seen = track.events.filter((e) => e.t <= t);
  const swings = seen.filter((e) => e.type === 'swing');
  const last = seen[seen.length - 1];
  const lastSwing = swings[swings.length - 1];
  const age = last ? t - last.t : Infinity;
  const k = last && KINDS[last.cue];

  const base = track.session || { swings: 0, good: 0 };
  const n = base.swings + swings.length, g = base.good + swings.filter((e) => e.cue === 'good').length;
  $('session').textContent = n ? `Swing ${n} · ${Math.round((g / n) * 100)}% on time` : 'Waiting for the band';

  const show = last && age < BANNER_S + FADE_S;
  $('cue').hidden = $('why').hidden = !show;
  if (show) {
    document.documentElement.style.setProperty('--cue', k.color);
    $('tag').textContent = k.tag;
    $('line').textContent = last.line;
    $('why').textContent = last.why || k.why(last.swing);
    const lvl = age < BANNER_S ? ease(age / 0.25) * (age > STALE_S ? 0.7 : 1) : 0.7 * (1 - ease((age - BANNER_S) / FADE_S));
    for (const id of ['cue', 'why']) $(id).style.opacity = lvl;
    $('cue').style.transform = `translateY(${10 * (1 - ease(age / 0.25))}px)`;
  }

  if (lastSwing) {
    const s = lastSwing.swing, sk = KINDS[lastSwing.cue];
    $('verdict').textContent = sk.verdict;
    $('verdict').style.color = sk.color;
    $('mark').style.left = `${barPos(s.impact_vs_peak_ms)}%`;
    $('mark').style.opacity = 1;
    $('speed').textContent = `${Math.round(s.peak_gyro).toLocaleString()}°/s`;
    $('contact').textContent = s.impact_vs_peak_ms > LATE_MS ? 'Late' : s.impact_vs_peak_ms < -40 ? 'Early' : 'Out front';
  }

  const lit = last && age < (last.type === 'tactic' ? TACTIC_LIGHT_S : SWING_LIGHT_S);
  $('orb').style.background = lit ? k.color : '';
  $('orb').style.boxShadow = lit ? `0 0 0 6px ${k.color}40` : '';
  $('lightText').textContent = lit ? k.light : 'Idle';
  $('edge').style.opacity = last && last.type === 'swing' && age < EDGE_S ? 0.5 * (1 - ease(age / EDGE_S)) : 0;

  const box = last && last.type === 'tactic' && last.target && show ? lerpBox(last.target.keys, t) : null;
  $('target').hidden = !box;
  if (box) {
    Object.assign($('target').style, { left: `${box.x - box.w / 2}%`, top: `${box.y - box.h / 2}%`, width: `${box.w}%`, height: `${box.h}%` });
    $('tname').textContent = last.target.name;
  }
};
</script>
</body>
</html>
