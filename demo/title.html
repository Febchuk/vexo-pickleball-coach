<style>
  html, body { margin: 0; height: 100%; background: #07090d; color: #f5f7fa; font-family: Geist, system-ui, sans-serif; }

  p { margin: 0; font-size: 36px; color: rgba(245,247,250,0.7); }

  .dots span { width: 16px; height: 16px; border-radius: 50%; }

  <div class="dots"><span style="background:#ffb000"></span><span style="background:#ffb000"></span><span style="background:#ffb000"></span><span style="background:#00ff40"></span><span style="background:#00ff40"></span></div>
